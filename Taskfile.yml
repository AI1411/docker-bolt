version: "3"

tasks:
  default:
    task: start

  install:
    desc: Install npm dependencies
    cmds:
      - npm install
    status:
      - test -d node_modules

  start:
    desc: Start DockBolt in development (Tauri + Vite)
    deps: [install]
    aliases: [dev, run]
    cmds:
      - npm run tauri -- dev

  ci:
    desc: Run the same checks as GitHub Actions (lint, tests, build)
    deps: [install]
    cmds:
      - npm run lint
      - npm test
      - npm run build
      - cargo fmt --all -- --check
      - cargo clippy --workspace --locked --all-targets -- -D warnings
      - cargo test --workspace --locked
