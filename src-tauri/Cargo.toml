[package]
name = "dockbolt"
version = "0.1.0"
edition = "2021"

[lib]
name = "dockbolt_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dockbolt-core = { path = "../crates/dockbolt-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
dirs = "5"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
open = "5"
rfd = "0.15"

[dev-dependencies]
serde_json = "1"
